services:
  impressoras:
    build: .
    image: impressoras:latest
    container_name: impressoras
    ports:
      - "8000:80"
    depends_on:
      - mariadb
    networks:
      - impressoras-network
    volumes:
      - ./:/var/www/html
    environment:
      HOME: /tmp
    user: "${UID:-1000}:${GID:-1000}"

  mariadb:
    image: mariadb:11
    container_name: impressoras_mariadb
    restart: always
    environment:
      MYSQL_DATABASE: impressoras
      MYSQL_USER: impressoras
      MYSQL_PASSWORD: impressoras
      MYSQL_ROOT_PASSWORD: impressoras
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - impressoras-network

  selenium:
    image: selenium/standalone-chrome
    container_name: impressoras_selenium
    ports:
      - "7900:7900" # VNC (pra ver o browser rodando)
    networks:
      - impressoras-network
    shm_size: 2gb

  senhaunica-faker:
    image: uspdev/senhaunica-faker
    container_name: impressoras_senhaunica-faker
    ports:
      - "3141:3141"
    environment:
      - APP_URL=http://auth.local:3141
    networks:
      impressoras-network:
        aliases:
          - auth.local

  cups:
    image: olbat/cupsd:stable-2026-08-03
    container_name: impressoras_cups
    ports:
      - '8631:631'
    volumes:
      - ./docker/cups/init-printers.sh:/init-printers.sh:ro
    entrypoint: ["/bin/sh", "/init-printers.sh"]
    environment:
      - CUPS_ADMIN=print
      - CUPS_PASSWORD=print
    networks:
      - impressoras-network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: impressoras_phpmyadmin
    restart: always
    depends_on:
      - mariadb
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: impressoras
    networks:
      - impressoras-network

  mailpit:
    image: axllent/mailpit:latest
    container_name: impressoras_mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Interface Web
    networks:
      - impressoras-network

networks:
  impressoras-network:

volumes:
  mariadb_data: